name: Build apps

# Собирает Заметки для Windows, macOS, Linux и Android, на каждой системе
# прогоняет самопроверку со снимками окон. Запуск: вкладка Actions → Build apps →
# Run workflow, либо публикация тега вида v3.1 (тогда файлы прикладываются к релизу).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            qpa: windows
          - name: macos
            os: macos-latest
            qpa: offscreen
          - name: linux
            os: ubuntu-22.04
            qpa: offscreen
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: ${{ matrix.qpa }}
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: System libraries for Qt (Linux)
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 \
            libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 libxcb-xinerama0 \
            libxcb-randr0 libxcb-render-util0 libxcb-image0 fonts-dejavu-core

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow

      - name: Fonts (Caveat, Marck Script, Lora, PT Sans, PT Serif)
        run: python tools/fetch_fonts.py fonts

      - name: Self-test from source
        run: python notes.py --selftest selftest-source

      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.name }}" = "macos" ]; then ICON=notes.png; else ICON=notes.ico; fi
          SEP=":"; [ "${{ matrix.name }}" = "windows" ] && SEP=";"
          python -m PyInstaller --noconfirm --clean --windowed --name Notes \
            --icon "$ICON" --osx-bundle-identifier app.notes.paper \
            --add-data "notes.ico${SEP}." --add-data "notes.png${SEP}." --add-data "fonts${SEP}fonts" \
            notes.py

      - name: Self-test of the built app
        shell: bash
        run: |
          case "${{ matrix.name }}" in
            windows) APP="dist/Notes/Notes.exe" ;;
            macos)   APP="dist/Notes.app/Contents/MacOS/Notes" ;;
            linux)   APP="dist/Notes/Notes" ;;
          esac
          if [ "${{ matrix.name }}" = "windows" ]; then
            pwsh -c "Start-Process -Wait -FilePath '$APP' -ArgumentList '--selftest','selftest-app'"
          else
            "$APP" --selftest selftest-app
          fi
          head -4 selftest-app/report.txt

      - name: Pack
        shell: bash
        run: |
          mkdir -p out
          case "${{ matrix.name }}" in
            windows) pwsh -c "Compress-Archive -Path dist/Notes -DestinationPath out/Notes-windows.zip" ;;
            macos)   ditto -c -k --keepParent dist/Notes.app out/Notes-macos.zip ;;
            linux)
              cp packaging/linux/install.sh packaging/linux/notes-paper.desktop.in notes.png dist/
              chmod +x dist/install.sh dist/Notes/Notes
              tar -czf out/Notes-linux.tar.gz -C dist Notes install.sh notes-paper.desktop.in notes.png ;;
          esac

      - uses: actions/upload-artifact@v4
        with:
          name: Notes-${{ matrix.name }}
          path: out/*

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-${{ matrix.name }}
          path: |
            selftest-source/
            selftest-app/

  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fonts
        run: python tools/fetch_fonts.py fonts

      - name: Android project
        working-directory: mobile-app
        run: |
          npm install
          npm run android

      - name: Build APK
        working-directory: mobile-app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          mkdir -p ../../out
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/Notes-android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Notes-android
          path: out/Notes-android.apk

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke test on an emulator (screenshot)
        continue-on-error: true
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            mkdir -p android-test
            adb install -r out/Notes-android.apk
            adb shell pm grant app.notes.paper android.permission.POST_NOTIFICATIONS || true
            adb shell am start -n app.notes.paper/.MainActivity
            sleep 25
            adb exec-out screencap -p > android-test/01_start.png
            adb shell input tap 980 2150 || true
            sleep 3
            adb exec-out screencap -p > android-test/02_new_note.png
            adb logcat -d -s Capacitor:* Capacitor/Console:* chromium:* > android-test/logcat.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: selftest-android
          path: android-test/

  release:
    name: Attach to release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [desktop, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: Notes-*
          merge-multiple: true
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/*

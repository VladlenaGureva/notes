<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F3ECDE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#221E1A" media="(prefers-color-scheme: dark)">
<meta name="description" content="Заметки по дням: календарь, напоминания, повторы">
<title>Заметки</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Lora:wght@400;500&family=Marck+Script&family=PT+Sans:wght@400;700&family=PT+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header class="paper-head">
    <div class="topbar">
      <h1 class="app-title" data-t="app">Заметки</h1>
      <div class="top-actions">
        <button class="icon-btn" id="btn-search" aria-label="Поиск" data-t-aria="search">
          <svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/></svg>
        </button>
        <button class="icon-btn" id="btn-archive" aria-label="Архив" data-t-aria="archive">
          <svg viewBox="0 0 24 24"><path d="M4 7h16v3H4zM5 10v9h14v-9M10 14h4"/></svg>
          <span class="badge" id="archive-count" hidden></span>
        </button>
        <button class="icon-btn" id="btn-settings" aria-label="Настройки" data-t-aria="settings">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
        </button>
      </div>
    </div>
    <div class="date-row">
      <button class="date-block" id="btn-month">
        <div class="weekday" id="weekday"></div>
        <div class="date-title" id="date-title"></div>
        <div class="stats" id="stats"></div>
      </button>
      <button class="pill" id="btn-today" data-t="today">Сегодня</button>
    </div>
    <div class="week">
      <button class="nav" id="week-prev" aria-label="‹">‹</button>
      <div class="week-days" id="week-days"></div>
      <button class="nav" id="week-next" aria-label="›">›</button>
    </div>
  </header>

  <main class="board" id="board">
    <button class="banner" id="carry" hidden></button>
    <div class="notes" id="notes"></div>
    <div class="empty" id="empty" hidden>
      <div class="quote" data-t="empty_quote">Красота — в мелочах</div>
      <div class="hint" data-t="empty_hint_m">Нажмите «+», чтобы добавить заметку</div>
    </div>
    <div class="flowers" id="flowers" aria-hidden="true"></div>
  </main>

  <button class="fab" id="fab" aria-label="Новая заметка" data-t-aria="new_note">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
  </button>
</div>

<div class="sheet-wrap" id="sheet-wrap" hidden>
  <div class="sheet-backdrop" id="sheet-backdrop"></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true">
    <div class="sheet-grip"></div>
    <h2 class="sheet-title" id="sheet-title"></h2>
    <div class="sheet-body" id="sheet-body"></div>
  </section>
</div>

<div class="toast" id="toast" hidden><span id="toast-text"></span><button id="toast-btn"></button></div>
<div class="popups" id="popups"></div>
<input type="file" id="import-file" accept=".json,application/json" hidden>

<script src="app.js"></script>
</body>
</html>
